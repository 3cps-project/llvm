name: Build the Nix derivation

on:
  workflow_dispatch: ~
  push:
    branches:
      - main

jobs:
  build-nix:
    name: Build Nix derivation on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        runs-on:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout LLVM
        uses: actions/checkout@v6

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v17
        with:
          name: 3cps
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build package
        run: |
          nix build --print-build-logs .#llvm
        


